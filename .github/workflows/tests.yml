name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install ffmpeg
        timeout-minutes: 15
        run: |
          if ! command -v ffmpeg >/dev/null; then
            for i in 1 2 3; do
              sudo timeout 180 apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                && sudo timeout 300 apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 ffmpeg \
                && break
              echo "apt attempt $i did not finish; trying again"; sleep 10
            done
          fi
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: for f in web/*.js; do node --check "$f"; done
