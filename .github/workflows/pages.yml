# Builds the static edition and publishes it to GitHub Pages.
# The pipeline scrapes public-domain / open-licence footage from the Internet Archive on the runner,
# cuts it into clips with ffmpeg, exports the player + manifest, and deploys. Runs weekly, on demand,
# and when the app code changes. The clip pool is cached between runs so it grows over time.
name: pages

on:
  workflow_dispatch:
    inputs:
      time_budget:
        description: seconds to spend scraping before exporting
        default: "2400"
      max_mb:
        description: size budget of the exported site in MB
        default: "600"
      seed_set:
        description: "which starter set to scrape: contemporary (mirrored web video), internet (social clips, weird happenings, vlogs), beauty, archival (public domain), all"
        default: "contemporary"
      restore_key:
        description: "to recover a pool: restore this exact cache key (corecore-media-<run id>) instead of the newest"
        default: ""
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths: ["corecore/**", "web/**", ".github/workflows/pages.yml", "requirements.txt"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}   # manual scrapes and push builds queue separately; a push no longer replaces a pending dispatch
  cancel-in-progress: false   # a push queues behind a running build instead of cancelling a 40-minute scrape

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install ffmpeg
        # the runner's own Ubuntu mirror can crawl (one served 40 KB/s for an afternoon): each attempt is
        # bounded, and later attempts go to other official Ubuntu mirrors, which carry the same signed packages
        timeout-minutes: 18
        run: |
          try_mirror() {
            if [ -n "$1" ] && [ -f /etc/apt/apt-mirrors.txt ]; then echo "$1" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null; fi
            sudo timeout 90 apt-get update -q -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              && sudo timeout 240 apt-get install -y -q --no-install-recommends -o Acquire::Retries=2 -o Acquire::http::Timeout=20 ffmpeg
          }
          if ! command -v ffmpeg > /dev/null; then
            for m in "" "http://archive.ubuntu.com/ubuntu/" "http://mirrors.edge.kernel.org/ubuntu/"; do
              try_mirror "$m" && break
              echo "apt via ${m:-the default mirror} did not finish; trying another mirror"
            done
          fi
          ffmpeg -version | head -1
      - name: install python deps
        run: pip install -r requirements.txt "opencv-python-headless<5"

      - name: restore clip pool from previous builds
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: media
          key: ${{ github.event.inputs.restore_key || format('corecore-media-{0}', github.run_id) }}
          restore-keys: corecore-media-

      - name: scrape, clip and export
        id: build
        env:
          CORECORE_SEGMENT_HEIGHT: "540"
          CORECORE_MAX_CLIPS_PER_SOURCE: "16"
          CORECORE_MAX_SOURCE_BYTES: "400000000"
          CORECORE_MAX_SOURCE_DURATION: "1500"
          CORECORE_ARCHIVE_PREFER_SMALL: "1"
        run: |
          # rotate through result pages week by week so scheduled builds keep finding new material
          export CORECORE_ARCHIVE_PAGE=$(( (10#$(date +%U) % 6) + 1 ))
          echo "archive page $CORECORE_ARCHIVE_PAGE"
          SET="${{ github.event.inputs.seed_set || 'contemporary' }}"
          # the cached pool holds archival material too; the site publishes only clips tagged modern,
          # whichever contemporary set (contemporary, beauty) a run scraped
          case "$SET" in archival|all) TAGS="" ;; *) TAGS="--tags modern" ;; esac
          # a push deploys code changes from the cached pool in minutes; scraping happens on the weekly
          # schedule and on manual runs (or when the cache turns out to be thin)
          case "${{ github.event_name }}" in
            push) BUDGET=0 ;;
            schedule) BUDGET=2400 ;;
            *) BUDGET="${{ github.event.inputs.time_budget || '2400' }}" ;;
          esac
          python -m corecore build-site --out site --set "$SET" $TAGS \
            --time-budget "$BUDGET" --min-clips 200 --fallback-budget 1500 \
            --max-mb "${{ github.event.inputs.max_mb || '600' }}"
          python -m corecore stats
          du -sh site

      - name: save clip pool for next build
        uses: actions/cache/save@v4
        # only a pool that was restored and then built on (finished or failed, not cancelled): a run
        # cancelled before its restore once saved an empty media folder as the newest pool
        if: always() && steps.restore.outcome == 'success' && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        with:
          path: media
          key: corecore-media-${{ github.run_id }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
